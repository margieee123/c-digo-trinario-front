name: CI - SpaApp Frontend

on:
  push:
    branches: [ desarrollo ]
  pull_request:
    branches: [ desarrollo ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: ng test --watch=false --coverage